name: CI

on:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Source suite: runtime tests, type tests and coverage (the 100%
      # thresholds in vitest.config.ts only apply under --coverage).
      - run: pnpm test:coverage
      # Re-runs the same suite against the built artifact (minified bundle +
      # emitted declarations), so a pull request cannot merge red on either.
      - run: pnpm test:dist

  size:
    name: Size
    runs-on: ubuntu-latest
    # The repo default GITHUB_TOKEN permissions are read-only; the action
    # posts the diff via the issue-comments API, which needs issues: write
    # even though the target is a pull request.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # Builds both the base and head commits itself and comments a brotli
      # size diff on the pull request. Brotli via node's zlib at default
      # quality is what `pnpm size` prints too — verified once, on the same
      # commit, that the two numbers agree.
      #
      # Known limitation: the action cannot comment on pull requests from
      # forks (no write permission for the token) and prints the diff to the
      # job log instead.
      - uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: dist/*.js
          compression: brotli
